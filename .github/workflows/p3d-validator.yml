name: P3D Validator smoke
on:
  push:
    paths:
      - 'utilities/p3d-validator/**'
      - 'tests/**'
      - '.github/workflows/p3d-validator.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'utilities/p3d-validator/**'
      - 'tests/**'
      - '.github/workflows/p3d-validator.yml'
      - '.gitattributes'
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source-only smoke
        run: python -m unittest discover -s tests -v
